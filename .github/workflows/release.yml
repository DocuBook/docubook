name: Release

on:
  push:
    branches: [main]

concurrency: ${{ github.workflow }}-${{ github.ref }}

permissions:
  actions: write
  contents: write
  pull-requests: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: step-security/setup-bun@v2

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Create Release Pull Request or Publish to npm
        id: changesets
        uses: changesets/action@v1
        with:
          publish: pnpm publish-packages
          version: pnpm version-packages
          commit: "chore: version packages"
          title: "chore: version packages"
          # Single product release — flame is the only output; the step below
          # creates the one `v<flame version>` tag and GitHub release, so
          # disable the per-package releases the action would otherwise create.
          createGithubReleases: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          HUSKY: "0"

      # `published` is true for any published package, so check flame
      # specifically before creating a product release: a release that ships
      # other packages only must not re-tag flame's unchanged version.
      - name: Detect whether flame was published
        id: flame
        if: steps.changesets.outputs.published == 'true'
        env:
          PUBLISHED_PACKAGES: ${{ steps.changesets.outputs.publishedPackages }}
        run: node scripts/published-packages.mjs @docubook/flame >> "$GITHUB_OUTPUT"

      - name: Create single GitHub Release (v<flame version>)
        if: steps.flame.outputs.released == 'true'
        run: |
          VERSION=$(node -p "require('./packages/flame/package.json').version")
          TAG="v${VERSION}"
          # The product ships as ONE tag (flame version). `changeset publish`
          # tags every published package (@docubook/*@<version>) — remove them
          # from local + origin and keep only the v<version> tag.
          for T in $(git tag -l "@docubook/*@${VERSION}"); do
            git tag -d "$T"
            git push origin --delete "$T" 2>/dev/null || true
          done
          # `v<flame version>` has to be a new tag. One that already exists on a
          # different commit means this release does not match the published
          # flame version, which must fail loudly instead of re-pointing a
          # published tag (and the Docker image built from it) to other code.
          if git rev-parse --verify --quiet "refs/tags/${TAG}" >/dev/null; then
            EXISTING=$(git rev-list -n 1 "$TAG")
            HEAD_SHA=$(git rev-parse HEAD)
            if [ "$EXISTING" != "$HEAD_SHA" ]; then
              echo "::error::${TAG} already exists at ${EXISTING}, not ${HEAD_SHA}; refusing to move a published tag." >&2
              exit 1
            fi
          fi
          git tag -f "$TAG"
          git push origin "$TAG"
          gh release create "$TAG" --title "$TAG" --generate-notes
          # Wait for npm replication before the Docker workflow installs this version.
          for attempt in $(seq 1 30); do
            if npm view "@docubook/flame@${VERSION}" version >/dev/null 2>&1; then
              break
            fi
            if [ "$attempt" -eq 30 ]; then
              echo "@docubook/flame@${VERSION} is not available on npm after 5 minutes" >&2
              exit 1
            fi
            sleep 10
          done
          gh workflow run docker-builder.yml --ref "$TAG" --field "version=$VERSION"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
