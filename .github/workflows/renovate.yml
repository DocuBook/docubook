name: Renovate

on:
  schedule:
    # Daily, so vulnerability PRs open within a day. Regular updates are
    # limited to Mondays by the `schedule` in .github/renovate.json.
    - cron: "0 3 * * *"
  workflow_dispatch:
    inputs:
      dryRun:
        description: "Dry Run mode"
        type: choice
        default: "disabled"
        options:
          - "disabled"
          - "full"
          - "lookup"
          - "extract"
      logLevel:
        description: "Log Level"
        type: choice
        default: "info"
        options:
          - "info"
          - "debug"

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  renovate:
    runs-on: ubuntu-latest
    steps:
      # Renovate clones the repository itself and reads .github/renovate.json
      # as the repository config, so no checkout or global config file.
      - name: Run Renovate
        uses: renovatebot/github-action@v46.3.10
        with:
          token: ${{ secrets.RENOVATE_TOKEN || secrets.GITHUB_TOKEN }}
        env:
          # Without this, self-hosted Renovate finds no repositories and
          # exits successfully without doing anything.
          RENOVATE_REPOSITORIES: ${{ github.repository }}
          # RENOVATE_TOKEN belongs to gitfromwildan and cannot read
          # /user/emails, so Renovate would fall back to Mend's shared
          # renovate@whitesourcesoftware.com. Use that account's noreply.
          RENOVATE_GIT_AUTHOR: "Renovate Bot <201965665+gitfromwildan@users.noreply.github.com>"
          LOG_LEVEL: ${{ inputs.logLevel || 'info' }}
          RENOVATE_DRY_RUN: ${{ inputs.dryRun != 'disabled' && inputs.dryRun || '' }}
